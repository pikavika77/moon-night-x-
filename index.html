<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Light X — Premium 18+ Adult Gallery</title>
  <meta name="description" content="Moon Light X – premium curated 18+ adult gallery. Fast, mobile-first platform with HD photography. Adults 18+ only.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const FB = {
      apiKey:            "AIzaSyACW8aFQmlaoaxNtE55m8Pck6H8BRlfEbs",
      authDomain:        "moon-night-x.firebaseapp.com",
      databaseURL:       "https://moon-night-x-default-rtdb.firebaseio.com",
      projectId:         "moon-night-x",
      storageBucket:     "moon-night-x.firebasestorage.app",
      messagingSenderId: "779934381788",
      appId:             "1:779934381788:web:1426fa035171015634a619"
    };

    function getFbApp() {
      const apps = getApps();
      return apps.length ? getApp() : initializeApp(FB);
    }

    function getUsernameFromHash() {
      const hash = (window.location.hash || '').replace(/^#\/?/, '');
      const parts = hash.split('/').filter(Boolean);
      if (!parts.length || parts[0] === 'admin' || parts[0] === 'super') return null;
      return parts[0];
    }

    async function trackVisit(db, clientId) {
      if (!clientId) return;
      try {
        const today = new Date().toISOString().slice(0, 10);
        if (clientId === 'global') {
          const infoRef = ref(db, 'superAdmin/stats/global');
          const snap = await get(infoRef);
          const cur = snap.exists() ? snap.val() : {};
          const upd = { totalVisits: (cur.totalVisits || 0) + 1 };
          if (cur.todayKey === today) { upd.todayVisits = (cur.todayVisits || 0) + 1; }
          else { upd.todayVisits = 1; upd.todayKey = today; }
          await update(infoRef, upd);
        } else {
          const infoRef = ref(db, `clients/${clientId}/info`);
          const snap = await get(infoRef);
          const cur = snap.exists() ? snap.val() : {};
          const upd = { totalVisits: (cur.totalVisits || 0) + 1 };
          if (cur.todayKey === today) { upd.todayVisits = (cur.todayVisits || 0) + 1; }
          else { upd.todayVisits = 1; upd.todayKey = today; }
          await update(infoRef, upd);
          await update(ref(db, `superAdmin/clients/${clientId}`), upd).catch(() => {});
        }
      } catch(e) { console.warn('Visit track error:', e); }
    }

    function execScriptsIn(el) {
      el.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) { s.src = old.src; s.async = true; }
        else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    }

    function injectPopunder(code) {
      if (!code) return;
      const div = document.getElementById('mlx-popunder-slot');
      if (div) { div.innerHTML = code; execScriptsIn(div); }
    }

    function injectBannerAds(ads) {
      if (!ads) return;
      const SLOT_MAP = {
        'adsterra-top-leaderboard':    ads.banner728 || '',
        'adsterra-native-incontent':   ads.box300    || '',
        'adsterra-mobile-sticky':      ads.banner320 || '',
        'adsterra-sidebar-skyscraper': ads.smart     || ''
      };
      const injected = new Set();
      const totalSlots = Object.values(SLOT_MAP).filter(Boolean).length;
      if (totalSlots === 0) return;

      const obs = new MutationObserver(() => {
        Object.entries(SLOT_MAP).forEach(([id, code]) => {
          if (!code || injected.has(id)) return;
          const el = document.getElementById(id);
          if (el) {
            el.innerHTML = code;
            execScriptsIn(el);
            injected.add(id);
          }
        });
        if (injected.size >= totalSlots) obs.disconnect();
      });
      obs.observe(document.body, { childList: true, subtree: true });
      setTimeout(() => obs.disconnect(), 25000);
    }

    async function resolveGlobalData(db) {
      let ads = {};
      let profile = {};

      try {
        const adsSnap = await get(ref(db, 'superAdmin/settings/globalAds'));
        if (adsSnap.exists()) ads = adsSnap.val() || {};
      } catch(e) { console.warn('Error fetching global ads:', e); }

      try {
        const profSnap = await get(ref(db, 'superAdmin/settings/siteProfile'));
        if (profSnap.exists()) profile = profSnap.val() || {};
      } catch(e) { console.warn('Error fetching global profile:', e); }

      window.__mlxImgPath = 'globalSite/images';
      window.__mlxCatPath = 'globalSite/categories';
      window.__mlxClientId = 'global';
      window.__mlxClientName = profile.name || 'Moon Light X';
      window.__mlxAds = {
        popunder: ads.popunder || '',
        banner728: ads.banner728 || '',
        banner320: ads.banner320 || '',
        box300: ads.box300 || '',
        smart: ads.smart || ''
      };
      window.__mlxProfile = {
        bio: profile.bio || '',
        avatar: profile.avatar || '',
        instagram: profile.instagram || '',
        telegram: profile.telegram || ''
      };

      trackVisit(db, 'global');
    }

    let isAppLoaded = false;

    function loadAppAssets() {
      if (isAppLoaded) return;
      isAppLoaded = true;

      const cssLink = document.createElement('link');
      cssLink.rel = 'stylesheet';
      cssLink.href = './app.css';
      document.head.appendChild(cssLink);

      const jsScript = document.createElement('script');
      jsScript.src = './app.js';
      document.body.appendChild(jsScript);
    }

    async function resolveData() {
      const fbApp = getFbApp();
      const db = getDatabase(fbApp);
      const username = getUsernameFromHash();

      if (username) {
        let clientId = null;
        let clientData = null;

        try {
          const snap = await get(ref(db, 'superAdmin/clients'));
          if (snap.exists()) {
            const clients = snap.val();
            for (const id in clients) {
              if (clients[id] && clients[id].username === username) {
                clientId = id;
                clientData = clients[id];
                break;
              }
            }
          }
        } catch(e) { console.warn('Error fetching clients:', e); }

        if (clientId) {
          let profile = {};
          try {
            const pSnap = await get(ref(db, `clients/${clientId}/info/profile`));
            if (pSnap.exists()) profile = pSnap.val();
            else if (clientData.profile) profile = clientData.profile;
          } catch(e) { console.warn('Error fetching profile:', e); }

          window.__mlxImgPath = `clients/${clientId}/images`;
          window.__mlxCatPath = `clients/${clientId}/categories`;
          window.__mlxClientId = clientId;
          window.__mlxClientName = clientData.name || username;
          if (clientData.name) document.title = `${clientData.name} — Gallery`;

          window.__mlxProfile = {
            bio: profile.bio || clientData.bio || '',
            avatar: profile.avatar || clientData.avatar || '',
            instagram: profile.instagram || clientData.instagram || '',
            telegram: profile.telegram || clientData.telegram || ''
          };

          window.__mlxAds = {
            popunder: clientData.adPopunder || (clientData.ads && clientData.ads.popunder) || '',
            banner728: clientData.adBanner728 || (clientData.ads && clientData.ads.banner728) || '',
            banner320: clientData.adBanner320 || (clientData.ads && clientData.ads.banner320) || '',
            box300: clientData.adBox300 || (clientData.ads && clientData.ads.box300) || '',
            smart: clientData.adSmart || (clientData.ads && clientData.ads.smart) || ''
          };

          trackVisit(db, clientId);
        } else {
          await resolveGlobalData(db);
        }
      } else {
        await resolveGlobalData(db);
      }

      injectPopunder(window.__mlxAds ? window.__mlxAds.popunder : '');
      loadAppAssets();
      injectBannerAds(window.__mlxAds);
    }

    window.addEventListener('hashchange', () => {
      resolveData().catch(console.warn);
    });

    await resolveData();
  </script>
</head>
<body>
  <div id="mlx-popunder-slot"></div>
  <div id="root"></div>
</body>
</html>
