  <style>
    /* Hide Adsterra placeholder labels */
    [class*="adsterra-placeholder"],
    [class*="ad-placeholder"],
    [class*="advertisement-label"] {
      display: none !important;
    }



    /* Target the specific label structure React renders */
    .adsterra-top-leaderboard > div:first-child:not(iframe):not(script),
    .adsterra-native-incontent > div:first-child:not(iframe):not(script),
    .adsterra-mobile-sticky > div:first-child:not(iframe):not(script),
    .adsterra-bottom-footer > div:first-child:not(iframe):not(script) {

    /* Hide any div that only contains placeholder text */
    #adsterra-top-leaderboard > div:not(:has(iframe)):not(:has(ins)),
    #adsterra-native-incontent > div:not(:has(iframe)):not(:has(ins)),
    #adsterra-sidebar-skyscraper > div:not(:has(iframe)):not(:has(ins)),

  <!-- STEP 1: Globals synchronously set BEFORE app.js loads + Immediate fast data prefetch -->
  <script>
    (function() {
      function getUsernameFromHash() {
        var hash = (window.location.hash || '').replace(/^#\/?/, '');
        var parts = hash.split('/').filter(Boolean);
        if (!parts.length || parts[0] === 'admin' || parts[0] === 'super' || parts[0] === 'gallery') return null;
        return parts[0];
      }

      var hash = window.location.hash || '';
      var hashParts = hash.split('/');
      var directImgId = hashParts[2] || '';
      if (directImgId) {
        window.__mlxDirectImageId = directImgId;
      }

      var username = getUsernameFromHash();
      if (username) {
        var cachedCid = null;
        try { cachedCid = localStorage.getItem('mnx_client_id_' + username); } catch(e){}
        var cid = cachedCid || username;
        window.__mlxImgPath    = 'clients/' + cid + '/images';
        window.__mlxCatPath    = 'clients/' + cid + '/categories';
        window.__mlxClientId   = cid;
        window.__mlxClientName = username;
      } else {
        window.__mlxImgPath    = 'globalSite/images';
        window.__mlxCatPath    = 'globalSite/categories';
        window.__mlxClientId   = 'global';
        window.__mlxClientName = 'Moon Light X';
      }

      // Load cached ads & profile synchronously if present
      try {
        var savedAds = localStorage.getItem('mnx_ads_' + window.__mlxClientId);
        if (savedAds) window.__mlxAds = JSON.parse(savedAds);
        var savedProf = localStorage.getItem('mnx_prof_' + window.__mlxClientId);
        if (savedProf) window.__mlxProfile = JSON.parse(savedProf);
      } catch(e){}

      if (!window.__mlxProfile) {
        window.__mlxProfile = {
          bio: '',
          avatar: '',
          instagram: '',
          telegram: '',
          socialLinks: { instagram: '', telegram: '' }
        };
      }

      if (!window.__mlxAds) {
        window.__mlxAds = {
          popunder:  '',
          banner728: '',
          banner320: '',
          box300:    '',
          smart:     ''
        };
      }

      window.__mlxDemoMode    = false;
      window.__mlxUseDemoData = false;
      window.__mlxSampleData  = [];
      window.__mlxFakeData    = false;
      window.__mlxDataReady   = false;

      // Fast background prefetch to RTDB REST API so localStorage has data ready before/when app.js mounts
      try {
        var imgKey = 'mnx_img_' + window.__mlxClientId;
        var tsKey  = 'mnx_ts_'  + window.__mlxClientId;
        var catKey = 'mnx_cat_' + window.__mlxClientId;
        var ctsKey = 'mnx_cts_' + window.__mlxClientId;

        var cachedTs = localStorage.getItem(tsKey);
        if (!cachedTs || (Date.now() - Number(cachedTs)) > 180000) {
          fetch('https://moon-night-x-default-rtdb.firebaseio.com/' + window.__mlxImgPath + '.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data && typeof data === 'object') {
                var arr = Array.isArray(data) ? data.filter(Boolean) : Object.values(data).filter(Boolean);
                if (arr.length > 0) {
                  localStorage.setItem(imgKey, JSON.stringify(arr));
                  localStorage.setItem(tsKey, String(Date.now()));
                }
              }
            }).catch(function(){});

          fetch('https://moon-night-x-default-rtdb.firebaseio.com/' + window.__mlxCatPath + '.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data && typeof data === 'object') {
                var arr = Array.isArray(data) ? data.filter(Boolean) : Object.values(data).filter(Boolean);
                if (arr.length > 0) {
                  localStorage.setItem(catKey, JSON.stringify(arr));
                  localStorage.setItem(ctsKey, String(Date.now()));
                }
              }
            }).catch(function(){});
        }
      } catch(e){}
    })();
  </script>

<body>

  <div id="root">

  <!-- STEP 3: Firebase async — live ads, profile updates, client resolution & visit tracking -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, get, update, set }   from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const FB = {
      apiKey:            "AIzaSyACW8aFQmlaoaxNtE55m8Pck6H8BRlfEbs",
      authDomain:        "moon-night-x.firebaseapp.com",
      databaseURL:       "https://moon-night-x-default-rtdb.firebaseio.com",
      projectId:         "moon-night-x",
      storageBucket:     "moon-night-x.firebasestorage.app",
      messagingSenderId: "779934381788",
      appId:             "1:779934381788:web:1426fa035171015634a619"
    };

    const fbApp = getApps().length ? getApp() : initializeApp(FB);
    const db    = getDatabase(fbApp);

    /* ── Parse username from hash ── */
    function getUsernameFromHash() {
      const hash  = (window.location.hash || '').replace(/^#\/?/, '');
      const parts = hash.split('/').filter(Boolean);
      if (!parts.length || parts[0] === 'admin' || parts[0] === 'super' || parts[0] === 'gallery') return null;
      return parts[0];
    }

    /* ── Report handler for React app ── */
    window.__mlxReportHandler = async function(imageId, reason) {
      const reportId = Date.now() + '_' + Math.random().toString(36).slice(2);
      const reportData = {
        imageId,
        reason:      reason || 'inappropriate',
        clientId:    window.__mlxClientId,
        clientName:  window.__mlxClientName,
        imagePath:   window.__mlxImgPath + '/' + imageId,
        reportedAt:  new Date().toISOString(),
        status:      'pending',
        reporterInfo: { userAgent: navigator.userAgent }
      };
      await set(ref(db, 'reports/' + reportId), reportData);
      await set(ref(db, 'superAdmin/reports/' + reportId), reportData);
      if (window.__mlxClientId && window.__mlxClientId !== 'global') {
        try {
          const cntRef = ref(db, `clients/${window.__mlxClientId}/reports/${imageId}/count`);
          const snap = await get(cntRef);
          const curCount = snap.exists() ? snap.val() : 0;
          await set(cntRef, curCount + 1);
        } catch(e) {}
      }
    };

    /* ── Visit tracking ── */
    async function trackVisit(clientId) {
      if (!clientId || clientId === 'global') return;
      try {
        const today   = new Date().toISOString().slice(0, 10);
        const infoRef = ref(db, `clients/${clientId}/info`);
        const snap    = await get(infoRef);
        const cur     = snap.exists() ? snap.val() : {};
        const upd     = { totalVisits: (cur.totalVisits || 0) + 1 };
        if (cur.todayKey === today) { upd.todayVisits = (cur.todayVisits || 0) + 1; }
        else { upd.todayVisits = 1; upd.todayKey = today; }
        await update(infoRef, upd);
        await update(ref(db, `superAdmin/clients/${clientId}`), upd).catch(() => {});
      } catch(e) { console.warn('Visit track:', e.message); }
    }

    /* ── Execute scripts injected via innerHTML ── */
    function execScriptsIn(el) {
      el.querySelectorAll('script').forEach(old => {
        if (!old || !old.parentNode) return;
        const s = document.createElement('script');
        if (old.src) { s.src = old.src; s.async = true; }
        else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
    }

    /* ── Inject popunder ── */
    function injectPopunder(code) {
      if (!code) return;
      const div = document.getElementById('mlx-popunder-slot');
      if (div) { div.innerHTML = code; execScriptsIn(div); }
    }

    /* ── Set slot dimensions to match ad size ── */
    function setSlotSize(slotId, width, height) {
      var el = document.getElementById(slotId);
      if (!el) return;
      el.style.width = width;
      el.style.height = height;
      el.style.minWidth = width;
      el.style.minHeight = height;
      el.style.overflow = 'hidden';
      el.style.display = 'block';
    }

    function applySlotSize(slotId) {
      var isMobile = (window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth) < 768;
      if (slotId === 'adsterra-top-leaderboard') {
        setSlotSize('adsterra-top-leaderboard', isMobile ? '320px' : '728px', isMobile ? '50px' : '90px');
      } else if (slotId === 'adsterra-native-incontent') {
        setSlotSize('adsterra-native-incontent', '300px', '250px');
      } else if (slotId === 'adsterra-sidebar-skyscraper') {
        setSlotSize('adsterra-sidebar-skyscraper', '160px', '600px');
      } else if (slotId === 'adsterra-mobile-sticky') {
        setSlotSize('adsterra-mobile-sticky', '320px', '50px');
      } else if (slotId === 'adsterra-bottom-footer') {
        setSlotSize('adsterra-bottom-footer', isMobile ? '320px' : '728px', isMobile ? '50px' : '90px');
      }
    }

    /* ── Inject banner/box ads into React ad slots ── */
    function injectBannerAds(ads) {
      if (!ads) return;

      function inject(slotId, code) {
        if (!code || !code.trim()) return false;
        var el = document.getElementById(slotId);
        if (!el) return false;
        if (el.dataset.adInjected === '1') return true;
        applySlotSize(slotId);
        var iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.style.overflow = 'hidden';
        iframe.scrolling = 'no';
        iframe.setAttribute('frameborder', '0');
        el.innerHTML = '';
        el.appendChild(iframe);
        el.dataset.adInjected = '1';
        try {
          var doc = iframe.contentWindow.document;
          doc.open();
          doc.write('<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;overflow:hidden;background:transparent;display:flex;justify-content:center;align-items:center;height:100%;}</style></head><body>' + code + '</body></html>');
          doc.close();
        } catch (e) {
          console.warn('Failed to write ad iframe for ' + slotId, e);
        }
        return true;
      }

      var SLOTS = [
        { id: 'adsterra-top-leaderboard',    code: ads.banner728 || '' },
        { id: 'adsterra-native-incontent',   code: ads.box300    || '' },
        { id: 'adsterra-sidebar-skyscraper', code: ads.smart     || '' },
        { id: 'adsterra-mobile-sticky',      code: ads.banner320 || '' },
        { id: 'adsterra-bottom-footer',      code: ads.banner728 || '' }
      ];

      function tryInjectAll() {
        var pending = [];
        for (var i = 0; i < SLOTS.length; i++) {
          if (!inject(SLOTS[i].id, SLOTS[i].code)) {
            if (SLOTS[i].code && SLOTS[i].code.trim()) {
              pending.push(SLOTS[i]);
            }
          }
        }
        return pending;
      }

      var pending = tryInjectAll();
      if (pending.length === 0) return;

      var obs = new MutationObserver(() => {
        var stillPending = [];
        for (var i = 0; i < pending.length; i++) {
          if (!inject(pending[i].id, pending[i].code)) {
            stillPending.push(pending[i]);
          }
        }
        pending = stillPending;
        if (pending.length === 0) obs.disconnect();
      });
      obs.observe(document.body, { childList: true, subtree: true });

      setTimeout(() => {
        obs.disconnect();
        tryInjectAll();
      }, 90000);

      window.addEventListener('load', function() {
        setTimeout(function() {
          tryInjectAll();
        }, 1000);
      });

      window.addEventListener('scroll', function onScroll() {
        var el = document.getElementById('adsterra-bottom-footer');
        if (el && !el.dataset.adInjected && ads.banner728) {
          inject('adsterra-bottom-footer', ads.banner728);
          if (el.dataset.adInjected) {
            window.removeEventListener('scroll', onScroll);
          }
        }
      }, { passive: true });
    }

    /* ── Main client resolver ── */
    async function resolveClient() {
      const hash = window.location.hash; // #/username/imageId
      const parts = hash.split('/');
      const usernameFromHash = parts[1] || '';
      const imageId  = parts[2] || '';

      if (imageId) {
        window.__mlxDirectImageId = imageId;
      }

      const username = getUsernameFromHash();

      if (!username) {
        window.__mlxImgPath    = 'globalSite/images';
        window.__mlxCatPath    = 'globalSite/categories';
        window.__mlxClientId   = 'global';
        window.__mlxClientName = 'Moon Light X';

        /* Load global ads and site profile */
        try {
          const [adsSnap, profSnap] = await Promise.all([
            get(ref(db, 'superAdmin/settings/globalAds')),
            get(ref(db, 'superAdmin/settings/siteProfile'))
          ]);
          const ads  = adsSnap.exists()  ? adsSnap.val()  : {};
          const prof = profSnap.exists() ? profSnap.val() : {};
          window.__mlxAds = {
            popunder:  ads.popunder  || '',
            banner728: ads.banner728 || '',
            banner320: ads.banner320 || '',
            box300:    ads.box300    || '',
            smart:     ads.smart     || ''
          };
          window.__mlxProfile = {
            bio:       prof.bio    || '',
            avatar:    prof.avatar || '',
            instagram: '',
            telegram:  '',
            socialLinks: { instagram: '', telegram: '' }
          };
          try {
            localStorage.setItem('mnx_ads_global', JSON.stringify(window.__mlxAds));
            localStorage.setItem('mnx_prof_global', JSON.stringify(window.__mlxProfile));
          } catch(e){}
          if (prof.name) {
            window.__mlxClientName = prof.name;
            document.title = `${prof.name} — Premium 18+ Gallery`;
          }
          injectPopunder(window.__mlxAds.popunder);
          injectBannerAds(window.__mlxAds);
        } catch(e) {
          console.warn('Global site data load error:', e);
        }
        window.dispatchEvent(new CustomEvent('mlx-client-resolved', { detail: { clientId: 'global', imgPath: 'globalSite/images', catPath: 'globalSite/categories' } }));
        window.__mlxDataReady = true;
        return true;
      }

      try {
        let client = null;

        let clientId = null;
        let clientData = null;

        /* Find client in Firebase by username and extract key as clientId */
        const snap = await get(ref(db, 'superAdmin/clients'));
        if (snap.exists()) {
          const clients = snap.val();
          const clientEntry = Object.entries(clients)
            .find(([id, c]) => c && c.username === username);

          if (clientEntry) {
            [clientId, clientData] = clientEntry;
          }
        }

        if (!clientData || clientData.status === 'deleted' || clientData.active === false) {
          document.body.innerHTML = `
    <div style="
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;height:100vh;background:#050505;
      color:#fff;font-family:sans-serif;text-align:center;gap:16px">
      <div style="font-size:48px">🚫</div>
      <div style="font-size:24px;font-weight:700">Page Not Found</div>
      <div style="font-size:14px;color:#666">
        This gallery is no longer available.
      </div>
    </div>`;
          return false;
        }

        if (clientId) {
          const cid = clientId;

          try { localStorage.setItem('mnx_client_id_' + username, cid); } catch(e){}

          window.__mlxClientId   = cid;
          window.__mlxImgPath    = 'clients/' + cid + '/images';
          window.__mlxCatPath    = 'clients/' + cid + '/categories';
          window.__mlxClientName = clientData.name || username;
          if (clientData.name) document.title = `${clientData.name} — Premium 18+ Gallery`;

          let p = {};
          try {
            const pSnap = await get(ref(db, `clients/${cid}/info/profile`));
            if (pSnap.exists()) p = pSnap.val();
          } catch(e) {}

          window.__mlxProfile = {
            bio:       p.bio       || '',
            avatar:    p.avatar    || '',
            instagram: p.instagram || '',
            telegram:  p.telegram  || '',
            socialLinks: {
              instagram: p.instagram || '',
              telegram:  p.telegram  || ''
            }
          };

          let ads = {};
          try {
            const adsSnap = await get(ref(db, `clients/${cid}/info/ads`));
            if (adsSnap.exists()) ads = adsSnap.val();
          } catch(e) {}
          window.__mlxAds = {
            popunder:  ads.popunder  || clientData.adPopunder  || '',
            banner728: ads.banner728 || clientData.adBanner728 || '',
            banner320: ads.banner320 || clientData.adBanner320 || '',
            box300:    ads.box300    || clientData.adBox300    || '',
            smart:     ads.smart     || clientData.adSmart     || ''
          };

          window.__mlxDemoMode    = false;
          window.__mlxUseDemoData = false;
          window.__mlxSampleData  = [];
          window.__mlxFakeData    = false;

          try {
            localStorage.setItem('mnx_ads_' + cid, JSON.stringify(window.__mlxAds));
            localStorage.setItem('mnx_prof_' + cid, JSON.stringify(window.__mlxProfile));
          } catch(e){}

          trackVisit(cid);
          injectPopunder(window.__mlxAds.popunder);
          injectBannerAds(window.__mlxAds);
          window.dispatchEvent(new CustomEvent('mlx-client-resolved', { detail: { clientId: cid, imgPath: window.__mlxImgPath, catPath: window.__mlxCatPath } }));
        }
      } catch(e) {
        console.warn('Resolver error:', e);
      }
      window.__mlxDataReady = true;
      return true;
    }

    let currentUsername = getUsernameFromHash();

    window.addEventListener('hashchange', () => {
      const newUsername = getUsernameFromHash();
      if (newUsername !== currentUsername) {
        currentUsername = newUsername;
        resolveClient();
      }
    });

    let appLoaded = false;
    function loadAppScript() {
      if (appLoaded) return;
      appLoaded = true;
      const s = document.createElement('script');
      s.src = './app.js';
      document.head.appendChild(s);
    }

    resolveClient().then(() => {
      loadAppScript();
    }).catch(e => {
      console.warn(e);
      loadAppScript();
    });
  </script>
